# the static game: the same rules as the _headers / _redirects written for Netlify
# (this file lands in conf.d, inside nginx's http block)

# pages always fresh (they carry the modules' ?v= version); modules a few minutes; three.js and assets a day
map $uri $dig_cache {
  ~^/src/     "public, max-age=300, must-revalidate";
  ~^/vendor/  "public, max-age=86400";
  ~^/assets/  "public, max-age=86400";
  default     "no-cache";
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

  # set once here: no location below adds its own headers, so they all get these
  add_header Cache-Control $dig_cache always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;

  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
  location = /serveur { try_files /serveur.html =404; }
  location / { try_files $uri $uri/ =404; }
}
